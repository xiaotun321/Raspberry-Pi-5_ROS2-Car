# x86_64 Linux -> ARM64 配置；可直接修改，或通过同名环境变量覆盖。
# 与你下载的 Arm GNU 10.3 工具链目录对应。
CAR_TOOLCHAIN_ROOT="${CAR_TOOLCHAIN_ROOT:-$HOME/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu}"
CAR_CROSS_PREFIX="${CAR_CROSS_PREFIX:-$CAR_TOOLCHAIN_ROOT/bin/aarch64-none-linux-gnu-}"
# 填写开发板 sysroot 根目录；其下应有 opt/ros/jazzy、usr/include 和系统库。
CAR_SYSROOT="${CAR_SYSROOT:-$HOME/rpi5-sysroot}"
