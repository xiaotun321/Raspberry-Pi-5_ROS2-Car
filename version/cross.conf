# x86_64 Linux -> ARM64 配置；可直接修改，或通过同名环境变量覆盖。
# 默认使用 Ubuntu 官方交叉工具链：sudo apt install gcc-13-aarch64-linux-gnu g++-13-aarch64-linux-gnu
# 该命令只提供带版本号的入口；未版本化入口来自元包 gcc-aarch64-linux-gnu，
# 或由 version/link_cross_tools.sh 在用户目录建软链接。
if [[ -z "${CAR_CROSS_PREFIX:-}" ]]; then
  if [[ -x /usr/bin/aarch64-linux-gnu-g++ ]]; then
    CAR_CROSS_PREFIX=/usr/bin/aarch64-linux-gnu-
  else
    CAR_CROSS_PREFIX="$HOME/bin/aarch64-linux-gnu-"
  fi
fi
# 改用 Arm GNU 官方工具链时，填好目录后取消下面两行的注释。
# CAR_TOOLCHAIN_ROOT="$HOME/gcc-arm-13.3.rel1-x86_64-aarch64-none-linux-gnu"
# CAR_CROSS_PREFIX="$CAR_TOOLCHAIN_ROOT/bin/aarch64-none-linux-gnu-"
# 填写开发板 sysroot 根目录；其下应有 opt/ros/jazzy、usr/include 和系统库。
# 由 version/build_sysroot.sh 生成。
CAR_SYSROOT="${CAR_SYSROOT:-$HOME/rpi5-sysroot}"
